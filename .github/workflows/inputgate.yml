name: Inputgate builds

on:
  push:
    branches: [ inputgate ]
  pull_request:
    branches: [ inputgate ]
  workflow_dispatch:

jobs:
  arch-linux:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-tools \
            libei libportal libxkbcommon wayland openssl avahi libx11 libxext libxtst \
            libxinerama libxrandr libxi libice libsm glib2 hicolor-icon-theme

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          git config --system --add safe.directory '*'
          su builder -c "cd '$GITHUB_WORKSPACE/dist/arch' && makepkg -f --nodeps"

      - uses: actions/upload-artifact@v4
        with:
          name: inputgate-arch-linux
          path: dist/arch/inputgate-3*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          path: inputgate
          submodules: recursive

      - name: Download Bonjour SDK-like
        id: bonjour
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Force -ItemType Directory -Path .\deps | Out-Null
          Invoke-WebRequest 'https://github.com/nelsonjchen/mDNSResponder/releases/download/v2019.05.08.1/x64_RelWithDebInfo.zip' -OutFile 'deps\BonjourSDKLike.zip'
          Expand-Archive .\deps\BonjourSDKLike.zip -DestinationPath .\deps\BonjourSDKLike
          "path=$env:GITHUB_WORKSPACE\deps\BonjourSDKLike" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6
          cache: true

      - name: Configure
        run: |
          cmake -S inputgate -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release -DQT_DEFAULT_MAJOR_VERSION=6 `
            -DINPUTLEAP_VERSION_DESC=inputgate `
            -DDNSSD_LIB="${{ steps.bonjour.outputs.path }}\Lib\x64\dnssd.lib" `
            -DCMAKE_INSTALL_PREFIX=input-leap-install
        env:
          BONJOUR_SDK_HOME: ${{ steps.bonjour.outputs.path }}

      - name: Build
        run: cmake --build build --config Release --target install

      - name: Run unit tests
        run: |
          $tests = Get-ChildItem -Recurse build -Filter unittests.exe | Select-Object -First 1
          & $tests.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp .\build\installer-inno\input-leap.iss

      - uses: actions/upload-artifact@v4
        with:
          name: inputgate-windows-installer
          path: .\build\installer-inno\bin
          if-no-files-found: error
